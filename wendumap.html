<style>
:root{
  --bg:#0b1220; --panel:#151f33; --panel-2:#101a2e;
  --border:#24314a; --text:#e5eaf3; --muted:#7e8ba6;
  --accent:#3b82f6; --accent-2:#60a5fa; --gold:#eab308;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(1200px 600px at 78% -10%, rgba(59,130,246,.12), transparent 60%),
    radial-gradient(900px 500px at 0% 115%, rgba(236,72,153,.07), transparent 55%),
    var(--bg);
  color:var(--text); font-family:-apple-system,"Noto Serif SC",Georgia,serif; font-size:13px; line-height:1.5;
}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:214px 1fr 300px;grid-template-rows:60px 1fr 34px;grid-template-areas:"top top top""left center right""bot bot bot";height:100vh;width:100vw}
.top{grid-area:top}.left{grid-area:left}.right{grid-area:right}.center{grid-area:center}.bot{grid-area:bot}

/* top */
.top{display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(15,23,42,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:#fff;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:800;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
.logo em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px}
.top .spacer{flex:1}
.badge{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.badge b{color:var(--accent-2);font-weight:700}

/* timeline */
.timeline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.era-chip{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:11px;cursor:pointer;transition:all .18s;white-space:nowrap;line-height:1.35;text-align:center}
.era-chip:hover{border-color:var(--accent);color:var(--text)}
.era-chip.active{color:#fff;border-color:var(--accent);background:linear-gradient(135deg,rgba(59,130,246,.35),rgba(139,92,246,.35));box-shadow:0 0 10px rgba(59,130,246,.4)}
.tl-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px;transition:all .15s}
.tl-btn:hover{border-color:var(--accent);color:#fff}
.tl-btn.playing{border-color:#22c55e;color:#4ade80}
/* region-tabs 已移除，改为纯时间线索排列 */

/* panels */
.panel{background:var(--panel);border-right:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.right.panel{border-left:1px solid var(--border);border-right:none}
.panel-body{overflow-y:auto;flex:1}
.panel-section{padding:12px 14px;border-bottom:1px solid var(--border)}
.panel-section:last-child{border-bottom:none}
.panel-section h3{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700}
.panel-section h3::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(180deg,var(--accent),#8b5cf6)}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:6px;cursor:pointer;color:var(--text);font-size:12px;border:1px solid transparent;background:transparent;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:var(--panel-2);border-color:var(--border)}
.nav-item.active{background:rgba(59,130,246,.18);border-color:var(--accent);color:#fff}
.nav-item .dot{width:8px;height:8px;border-radius:50%;margin-right:8px;flex-shrink:0;box-shadow:0 0 6px var(--dc,transparent)}
.nav-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{color:var(--muted);font-size:11px}
.legend-list{display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}
.legend-item .d{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-item .link-line{width:24px;height:2px;background:#60a5fa;border-radius:2px;flex-shrink:0}

/* center */
.center{display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.map-hint{position:absolute;top:8px;left:10px;font-size:11px;color:var(--muted);background:rgba(11,18,32,.65);padding:4px 8px;border-radius:5px;pointer-events:none;z-index:2}
.frame{position:relative;flex:1;overflow:hidden}
svg{width:100%;height:100%;display:block}
.country-anchor{opacity:.7;transition:opacity .2s}
.country-anchor.on{opacity:1}
.country-anchor text{fill:var(--muted);font-size:13px;font-weight:600;stroke:#0b1220;stroke-width:3px;paint-order:stroke}
.school{transition:opacity .25s, filter .25s}
.school g{cursor:pointer}
.school .halo{opacity:.18}
.school.off{opacity:.14}
.school.dim{opacity:.32}
.school.on .halo{opacity:.4}
.school.on .core{filter:drop-shadow(0 0 7px var(--sc))}
.school .core{transition:r .2s, filter .2s}
.school text.slabel{fill:#fff;font-size:8.5px;stroke:#0b1220;stroke-width:2.2px;paint-order:stroke;pointer-events:none}
.sch-link{transition:opacity .25s}
.sch-link .l{stroke:#60a5fa;stroke-width:1.1;opacity:.55;marker-end:url(#arr)}
.sch-link .lt{fill:var(--muted);font-size:8px;stroke:#0b1220;stroke-width:1.6px;paint-order:stroke;pointer-events:none}
.link-arrow{stroke:#60a5fa;fill:#60a5fa}
.sch-link.off{opacity:.1}
.sch-link.on .l{opacity:.95;stroke-width:1.6;stroke:#93c5fd}

/* right detail */
.detail{display:flex;flex-direction:column;gap:8px;font-size:12px}
.d-title{font-size:15px;font-weight:700;color:#fff;line-height:1.35}
.d-type{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:11px}
.d-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--border)}
.d-row .k{color:var(--muted)}
.d-row .v{color:var(--text)}
.d-fig{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fig-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-size:11px}
.fig-chip:hover{border-color:var(--accent);color:#fff;text-decoration:none}
.d-links{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.d-link-row{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.d-link-row b{color:var(--accent-2);font-weight:600}
.d-link-row .lt{color:var(--text);flex:1}
.cta{display:inline-block;margin-top:8px;padding:6px 10px;text-align:center;background:var(--accent);color:#fff;border-radius:5px;font-size:12px}
.cta:hover{background:#2563eb;text-decoration:none;color:#fff}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:20px 8px;line-height:1.7}
.theme-legend{margin-top:8px}

/* bot */
.bot{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.bot a{color:var(--muted);padding:4px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:5px}
.bot a:hover{background:var(--panel-2);color:var(--text);text-decoration:none}
.bot .sep{color:#334155}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#24314a;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3b82f6}
</style>

<script>

const BASE = location.pathname.startsWith("/Western-Literary-Theory-LLM-Wiki")
  ? "/Western-Literary-Theory-LLM-Wiki/" : "/";

// 主题 → 颜色映射（流派按理论谱系着色）
const THEME = {
  phil:     {name:"德国古典·美学传统", color:"#eab308"},
  marx:     {name:"马克思主义谱系",   color:"#ef4444"},
  formal:   {name:"形式主义·符号学",   color:"#f97316"},
  struct:   {name:"结构·后结构主义",   color:"#a855f7"},
  psych:    {name:"精神分析",          color:"#ec4899"},
  phen:     {name:"现象学·存在主义",   color:"#06b6d4"},
  herm:     {name:"解释学·接受美学",   color:"#22c55e"},
  cult:     {name:"文化研究",          color:"#84cc16"},
  femin:    {name:"女性主义",          color:"#f472b6"},
  post:     {name:"'后'学·激进左翼",   color:"#8b5cf6"},
  analytic: {name:"分析·语用·认知",    color:"#0ea5e9"},
  art:      {name:"现代主义艺术",      color:"#64748b"}
};

const WENDUMAP = /*__WENDUMAP_DATA__*/{};
const { eras, countries, schools, links } = WENDUMAP;

const schoolById = {};
schools.forEach(s => schoolById[s.id] = s);
const countryById = {};
countries.forEach(c => countryById[c.id] = c);

/* ---------- 可视化状态 ---------- */
let view = {
  era: 0,             // 当前时代（-1=忽略时代筛选）
  country: null,      // 选中国家
  school: null,       // 选中流派
  playIdx: 0, playing:false, timer:null,
  hovered: null
};
let pos = {};         // schoolId -> {x,y}

/* ---------- 坐标：流派气泡围绕所属国家散点 ---------- */
function computePositions(){
  const byCountry = {};
  schools.forEach(s => { (byCountry[s.country] = byCountry[s.country] || []).push(s); });
  Object.keys(byCountry).forEach(cid => {
    const list = byCountry[cid], C = countryById[cid];
    const R = 20 + Math.min(list.length-1, 6)*13;
    list.forEach((s,i)=>{
      const n = list.length;
      const ang = (i/n)*Math.PI*2 - Math.PI/2 + (n>1? Math.PI/n : 0);
      pos[s.id] = { x: C.x + Math.cos(ang)*R, y: C.y + Math.sin(ang)*R };
    });
  });
}

}
/* ---------- 国家锚点 ---------- */
function buildCountries(){
  const L = document.getElementById('countryLayer');
  L.innerHTML = countries.map(c=>`
    <g class="country-anchor" data-c="`+c.id+`" transform="translate(`+c.x+`,`+c.y+`)">
      <circle r="4" fill="#60a5fa" opacity="0.85"/>
      <text y="-9" text-anchor="middle">`+c.name+`</text>
    </g>`).join('');
  L.querySelectorAll('.country-anchor').forEach(g=>{
    g.addEventListener('click',()=>{ toggleCountry(g.dataset.c); });
  });
}

/* ---------- 连线 ---------- */
function buildLinks(){
  const L = document.getElementById('linkLayer');
  L.innerHTML = links.map(l=>{
    const a=pos[l.from], b=pos[l.to];
    if(!a||!b) return '';
    return `<g class="sch-link" data-link="`+l.from+`→`+l.to+`">
      <line class="l" x1="`+a.x+`" y1="`+a.y+`" x2="`+b.x+`" y2="`+b.y+`"/>
      <text class="lt" x="`+((a.x+b.x)/2)+`" y="`+((a.y+b.y)/2 - 4)+`" text-anchor="middle">`+l.label+`</text>
    </g>`;
  }).join('');
}

/* ---------- 流派气泡 ---------- */
function buildSchools(){
  const L = document.getElementById('schoolLayer');
  L.innerHTML = schools.map(s=>{
    const p = pos[s.id], c = THEME[s.theme].color;
    return `<g class="school" data-school="`+s.id+`" transform="translate(`+p.x+`,`+p.y+`)" style="--sc:`+c+`">
      <circle class="halo" r="13" fill="`+c+`" opacity="0.18"/>
      <circle class="core" r="6.5" fill="`+c+`" stroke="#fff" stroke-opacity="0.35" stroke-width="0.8"/>
      <text class="slabel" y="16" text-anchor="middle">`+s.name+`</text>
    </g>`;
  }).join('');
  L.querySelectorAll('.school').forEach(g=>{
    const id = g.dataset.school;
    g.addEventListener('click', (e)=>{ e.stopPropagation(); selectSchool(id); });
    g.addEventListener('mouseenter', ()=>{ view.hovered=id; sync(); });
    g.addEventListener('mouseleave', ()=>{ view.hovered=null; sync(); });
  });
}

/* ---------- 同步可视化：时代点亮 + 国家聚焦 + 选中高亮 ---------- */
function activeOnEra(s, era){
  if(era<0) return true;
  return (s.spans||[s.era]).indexOf(era) >= 0;
}
function sync(){
  const cur = view.era, cid = view.country, sel = view.school, hv = view.hovered;

  // country anchors（全部显示）
  document.querySelectorAll('.country-anchor').forEach(g=>{
    g.style.display = '';
    g.classList.toggle('on', !cid || g.dataset.c===cid);
  });

  // links visibility（按时代 + 国家）
  let liveCount = 0;
  document.querySelectorAll('.sch-link').forEach(g=>{
    const [f,t] = g.dataset.link.split('→');
    const sF=schoolById[f], sT=schoolById[t];
    const matchEra = (cur<0) || activeOnEra(sF,cur) || activeOnEra(sT,cur);
    const matchCountry = !cid || sF.country===cid || sT.country===cid;
    const on = matchEra && matchCountry;
    let rel = false;
    if(sel){ rel = (f===sel||t===sel); }
    g.classList.toggle('on', on && (sel? rel : true));
    g.classList.toggle('off', !(on && (sel? rel : true)));
  });

  // schools
  document.querySelectorAll('.school').forEach(g=>{
    const s = schoolById[g.dataset.school];
    const matchEra = activeOnEra(s, cur);
    const matchCountry = !cid || s.country===cid;
    const base = matchEra && matchCountry;
    const isSel = sel===s.id;
    if(!base){ g.classList.add('off'); g.classList.remove('on','dim'); }
    else{
      g.classList.remove('off');
      if(isSel){ g.classList.add('on'); g.classList.remove('dim'); }
      else if(sel && hv && (links.some(l=>(l.from===s.id&&l.to===sel)||(l.to===s.id&&l.from===sel)))){ g.classList.add('on'); g.classList.remove('dim'); }
      else if(sel){ g.classList.add('dim'); g.classList.remove('on'); }
      else{ g.classList.add('on'); g.classList.remove('dim'); }
      liveCount++;
    }
  });
  document.getElementById('liveCount').textContent = liveCount;

  // timeline chips
  document.querySelectorAll('.era-chip').forEach(ch=>{
    ch.classList.toggle('active', ch.dataset.era == cur);
  });
  // country nav
  document.querySelectorAll('#countryNav .nav-item').forEach(it=>{
    it.classList.toggle('active', it.dataset.c==cid);
  });

  if(sel){ renderDetail(sel); renderRel(sel); }
  else{ renderDetail(null); renderRel(null); }
}

/* ---------- 板块切换 ---------- */
/* region-tabs 已移除 */

/* ---------- 时间轴 ---------- */
function renderTimeline(){
  const box = document.getElementById('timeline');
  // 每个时代的学校数量和涉及的国家
  const eraInfo = eras.map((e,i)=>{
    const eraSchools = schools.filter(s=>(s.spans||[s.era]).indexOf(i)>=0);
    const eraCountries = [...new Set(eraSchools.map(s=>countryById[s.country]?.name).filter(Boolean))];
    return { name:e, count:eraSchools.length, countries:eraCountries };
  });
  box.innerHTML = `<button class="tl-btn" id="btnPlay" title="播放时代变迁">▶ 播放</button>` +
    eraInfo.map((e,i)=>{
      const tip = e.countries.length ? e.countries.join('、') : '—';
      return `<span class="era-chip" data-era="${i}" title="${tip}">${e.name}<br><small style="opacity:.7">${e.count}个流派</small></span>`;
    }).join('') +
    `<button class="tl-btn" id="btnReset" title="显示全部时代" style="margin-left:2px">全部</button>`;
  box.querySelectorAll('.era-chip').forEach(ch=>{
    ch.addEventListener('click',()=>{ stopPlay(); view.era=+ch.dataset.era; sync(); });
  });
  document.getElementById('btnPlay').addEventListener('click', togglePlay);
  document.getElementById('btnReset').addEventListener('click',()=>{ stopPlay(); view.era=-1; sync(); });
}
function togglePlay(){
  view.playing = !view.playing;
  const btn = document.getElementById('btnPlay');
  btn.textContent = view.playing ? '⏸ 暂停' : '▶ 播放';
  btn.classList.toggle('playing', view.playing);
  if(view.playing){
    if(view.era<0) view.era=0;
    view.playIdx = view.era;
    stepPlay();
  } else { clearInterval(view.timer); }
}
function stopPlay(){ if(view.playing){ view.playing=false; document.getElementById('btnPlay').textContent='▶ 播放'; document.getElementById('btnPlay').classList.remove('playing'); clearInterval(view.timer); } }
function stepPlay(){
  if(!view.playing) return;
  view.era = view.playIdx;
  sync();
  renderPlayNote();
  view.playIdx++;
  if(view.playIdx >= eras.length){ stopPlay(); return; }
  clearInterval(view.timer);
  view.timer = setInterval(()=>{
    view.era = view.playIdx;
    sync(); renderPlayNote();
    view.playIdx++;
    if(view.playIdx >= eras.length){ stopPlay(); }
  }, 2600);
}
function renderPlayNote(){
  document.getElementById('selEra').textContent = '时代 '+ (view.era+1) +'/'+eras.length +' · '+eras[view.era];
}

/* ---------- 左侧国家列表 ---------- */
function renderCountries(){
  const box = document.getElementById('countryNav');
  box.innerHTML = countries.map(c=>{
    const n = schools.filter(s=>s.country===c.id).length;
    return `<button class="nav-item" data-c="`+c.id+`"><span class="dot" style="--dc:#60a5fa"></span><span class="name">`+c.name+`</span><span class="cnt">`+n+`</span></button>`;
  }).join('');
  box.querySelectorAll('.nav-item').forEach(b=>{
    b.addEventListener('click',()=>{ toggleCountry(b.dataset.c); });
  });
}
function toggleCountry(c){
  view.country = (view.country===c)? null : c;
  if(!view.country) view.school = null;
  sync();
}
/* ---------- 主题图例 ---------- */
function renderLegend(){
  const box = document.getElementById('themeLegend');
  box.innerHTML = Object.values(THEME).map(t=>
    `<div class="legend-item"><span class="d" style="background:`+t.color+`"></span>`+t.name+`</div>`).join('');
}

/* ---------- 右侧详情 ---------- */
function renderDetail(sel){
  const box = document.getElementById('detailBox');
  const selEra = document.getElementById('selEra');
  if(!sel){
    const txt = (view.era<0)? '当前：显示全部时代' : ('当前：'+eras[view.era]);
    selEra.textContent = txt;
    box.innerHTML = `<div class="empty">点击地图中的流派气泡<br>查看其时代 · 国家 · 代表人物</div>`;
    return;
  }
  const s = schoolById[sel], c = countryById[s.country], t = THEME[s.theme];
  selEra.textContent = '时代 '+((s.spans||[s.era]).map(i=>i+1).join('·'));
  box.innerHTML =
    `<div class="d-title">`+s.name+`</div>`+
    `<span class="d-type" style="background:`+t.color+`;color:#fff">`+t.name+`</span>`+
    `<div class="d-row"><span class="k">所处时代</span><span class="v">`+eras[s.era]+`</span></div>`+
    `<div class="d-row"><span class="k">国家/地区</span><span class="v">`+c.name+` · `+ (s.period||'—') +`</span></div>`+
    `<div class="d-row"><span class="k">代表人物</span></div>`+
    `<div class="d-fig">`+ (s.figures||[]).map(f=>
      `<a class="fig-chip" href="`+BASE+`search.html?q=`+encodeURIComponent(f)+`">`+f+`</a>`).join('') +`</div>`+
    `<a class="cta" href="`+BASE+`search.html?q=`+encodeURIComponent(s.name)+`">在知识库检索「`+s.name+`」→</a>`;
}
function renderRel(sel){
  const box = document.getElementById('relLinks');
  if(!sel){ box.innerHTML = `<div class="empty">暂无选中</div>`; return; }
  const rel = links.filter(l=>l.from===sel||l.to===sel);
  if(rel.length===0){ box.innerHTML = `<div class="empty">该流派暂无明显传承连线</div>`; return; }
  box.innerHTML = rel.map(l=>{
    const other = (l.from===sel)? schoolById[l.to] : schoolById[l.from];
    const dir = (l.from===sel)? '→' : '←';
    return `<div class="d-link-row"><b>`+dir+`</b><span class="lt">`+schoolById[l.from].name+` − `+schoolById[l.to].name+`</span><span class="lt" style="color:var(--muted)">[`+l.type+`: `+l.label+`]</span></div>`;
  }).join('');
}

/* ---------- 选中流派 ---------- */
function selectSchool(id){
  view.school = (view.school===id)? null : id;
  sync();
}

/* ---------- 拖拽平移 ---------- */
function initPan(){
  const svg = document.getElementById('map');
  const frame = document.getElementById('frame');
  svg.style.cursor = 'grab';
  let down=false,sx=0,sy=0,tx=0,ty=0,scale=1;
  const gview = view; // reuse
  function apply(){ svg.setAttribute('transform','translate('+tx+','+ty+') scale('+scale+')'); }
  svg.addEventListener('mousedown',e=>{ down=true; sx=e.clientX; sy=e.clientY; svg.style.cursor='grabbing'; });
  frame.addEventListener('mousemove',e=>{ if(!down)return; tx+=(e.clientX-sx); ty+=(e.clientY-sy); sx=e.clientX; sy=e.clientY; apply(); });
  window.addEventListener('mouseup',()=>{ down=false; svg.style.cursor='grab'; });
  frame.addEventListener('wheel',e=>{ e.preventDefault(); scale = Math.max(.4, Math.min(2.4, scale*(e.deltaY<0?1.1:0.9))); apply(); },{passive:false});
}

/* ---------- boot ---------- */
computePositions();
renderTimeline();
renderCountries();
renderLegend();
buildBg();
buildCountries();
buildLinks();
buildSchools();
renderPlayNote();
sync();
initPan();
</script>
